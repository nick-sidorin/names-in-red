name: Publish release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (major.minor.patch)
        required: true
        type: string
      commit:
        description: Exact approved main commit SHA (40 characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: names-in-red-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'nick-sidorin/names-in-red' && github.actor == 'nick-sidorin' && github.triggering_actor == 'nick-sidorin'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.intent.outputs.commit }}
      version: ${{ steps.intent.outputs.version }}
      mode: ${{ steps.intent.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner and release intent
        id: intent
        env:
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 scripts/release_intent.py
      - name: Verify approved main commit and integrated checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.intent.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$COMMIT^{commit}")" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/main
          # Check the exact main-push run, not a PR or tag run.
          runs="repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$COMMIT"
          gh api "$runs" --jq '.workflow_runs[0].conclusion' | grep -Fx success
          git checkout --detach "$COMMIT"
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: bash scripts/check.sh
      - name: Package exact tagged source
        env:
          VERSION: ${{ steps.intent.outputs.version }}
          COMMIT: ${{ steps.intent.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --commit "$COMMIT" --version "$VERSION" --output dist
          cd dist
          sha256sum "NamesInRed-$VERSION.zip" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-release
          path: dist/
          if-no-files-found: error

  publish:
    if: github.repository == 'nick-sidorin/names-in-red' && github.actor == 'nick-sidorin' && github.triggering_actor == 'nick-sidorin' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tagged-release
          path: dist
      - name: Create or verify tag, verify asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.build.outputs.mode }}
          TAG: v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          asset="NamesInRed-$VERSION.zip"
          title="Names in Red $VERSION"
          marker="<!-- names-in-red-source: $COMMIT -->"
          remote_tag() {
            local refs
            refs=$(git ls-remote --tags "https://github.com/$REPO.git" "refs/tags/$TAG" "refs/tags/$TAG^{}") || return 1
            awk -v ref="refs/tags/$TAG" '$2 == ref {tag=$1} $2 == ref "^{}" {peeled=$1} END {print peeled ? peeled : tag}' <<< "$refs"
          }
          verify_remote_tag() {
            test "$(remote_tag)" = "$COMMIT"
          }
          # Search releases including drafts. A failing API lookup aborts rather
          # than treating a permission or network failure as a missing release.
          releases=$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")
          release=$(jq -cer --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | if length <= 1 then first // {} else error("duplicate releases") end' <<< "$releases")
          actual=$(remote_tag)
          if [[ -z "$actual" ]]; then
            test "$MODE" = request
            test "$release" = '{}'
            # Never force or move a tag. The same job publishes because a
            # GITHUB_TOKEN-created tag does not trigger another Actions run.
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$COMMIT" >/dev/null
          elif [[ "$actual" != "$COMMIT" ]]; then
            echo "Refusing to move existing tag $TAG" >&2
            exit 1
          fi
          verify_remote_tag

          if [[ "$release" == '{}' ]]; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --draft --title "$title" --notes-file release-notes.md
            release=$(gh release view "$TAG" --repo "$REPO" --json name,body,isDraft,isPrerelease,assets)
          fi
          jq -e --arg title "$title" --arg marker "$marker" --arg asset "$asset" '
            (.name == $title) and (.body | contains($marker)) and
            ((.prerelease // .isPrerelease // false) | not) and
            ([.assets[].name] | all(. == $asset))
          ' <<< "$release" > /dev/null
          draft=$(jq -r '.draft // .isDraft // false' <<< "$release")
          if [[ $(jq '.assets | length' <<< "$release") == 0 ]]; then
            test "$draft" = true
            gh release upload "$TAG" "$asset" --repo "$REPO"
          fi
          mkdir verified
          gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir verified
          cmp "$asset" "verified/$asset"
          verify_remote_tag
          if [[ "$draft" == true ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
          published=$(gh release view "$TAG" --repo "$REPO" --json url,tagName,isDraft,isPrerelease,assets)
          jq -e --arg tag "$TAG" --arg asset "$asset" '
            .tagName == $tag and (.isDraft | not) and (.isPrerelease | not) and
            ([.assets[].name] == [$asset])
          ' <<< "$published" > /dev/null
          jq -r '.url' <<< "$published"
