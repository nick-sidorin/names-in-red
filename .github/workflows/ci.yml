name: CI

on: [pull_request, push]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: bash scripts/check.sh
      - name: Stage debug preview
        id: preview
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/')
        run: |
          version=$(sed -n 's/^## Version: //p' NamesInRed/NamesInRed.toc)
          test -n "$version"
          echo "name=NamesInRed-$version" >> "$GITHUB_OUTPUT"
          mkdir -p preview
          cp -R NamesInRed preview/
          (cd preview && python3 ../scripts/check_manifest.py)
      - name: Upload debug preview
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.preview.outputs.name }}
          path: preview/
          if-no-files-found: error
