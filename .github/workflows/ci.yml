name: CI

on: [pull_request, push]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: bash scripts/check.sh
      - name: Stage debug preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/debug/pvp-evidence'
        run: mkdir -p preview && cp -R NamesInRed preview/
      - name: Upload debug preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/debug/pvp-evidence'
        uses: actions/upload-artifact@v4
        with:
          name: NamesInRed-0.0.1-debug
          path: preview/
          if-no-files-found: error
